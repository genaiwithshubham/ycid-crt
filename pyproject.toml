[project]
name = "ycid-crt"
version = "0.1.0"
description = "A production-quality Python application for discovering, organizing, ranking, and analyzing publicly available YouTube interviews and clips related to celebrities."
readme = "README.md"
authors = [
    { name = "Shubham Aggarwal", email = "shubham.fullstack08@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "typer>=0.27.1",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
    "google-api-python-client>=2.100.0",
    "youtube-transcript-api>=0.6.0",
    "httpx>=0.27.0",
    "python-dateutil>=2.8.0",
    "openai>=3.1.0",
    "anthropic>=0.122.0",
    "ollama>=0.6.2",
    "yt-dlp>=2024.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.23.0"
]
